<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>오늘, 우리 아이들</title><link rel="stylesheet" href="monitor.css"><main><header><div><span class="eyebrow">엄마의 오늘 체크</span><h1>오늘, 우리 아이들 <span>🌷</span></h1><p id="today"></p></div><button id="refresh">새로고침 ↻</button></header><section id="connect" class="connect"><h2>패드와 연결해 주세요</h2><p>패드의 설정 → 엄마 웹 조회 주소를 복사해 이 화면을 열면 바로 연결됩니다.</p><form id="connect-form"><label for="channel">조회 주소 또는 채널</label><div><input id="channel" autocomplete="off" required placeholder="패드에 표시된 조회 주소"><button>연결</button></div></form></section><div class="sync-line"><span id="connection" role="status">연결 대기</span><span id="updated"></span></div><section id="cards" class="cards" aria-live="polite"></section><p id="notice" class="notice">패드에서 보낸 마지막 상태를 표시합니다.</p><footer>오늘의 작은 성취를 함께 지켜봐요. ♡ <button id="disconnect">연결 해제</button></footer></main><script src="monitor.js"></script></html>
